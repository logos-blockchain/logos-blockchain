name: Logos Genesis Ceremony workflow

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "Target deployment environment (e.g., devnet, testnet)"
        required: true
        default: "devnet"
        type: choice
        options:
          - devnet
          - testnet
      version:
        description: "Release version, named in the ceremony's commit message"
        required: true

permissions:
  contents: read

jobs:
  # Builds and runs the ceremony with a read-only token, and hands its output to the `commit` job as a
  # patch, so the token that can push never shares a job with the compiled code.
  genesis-ceremony:
    name: Genesis Ceremony
    runs-on: ubuntu-24.04
    env:
      LB_TARGET_ENV: ${{ github.event.inputs.deployment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Run Ceremony
        run: |
          cargo run --locked --bin logos-blockchain-tools-genesis -- ceremony \
            --inscription-params deployment/ceremony/genesis/$LB_TARGET_ENV/inscribe.yaml \
            --stake-holders deployment/ceremony/genesis/$LB_TARGET_ENV/stakeholders.yaml \
            --providers deployment/ceremony/genesis/$LB_TARGET_ENV/providers.yaml \
            --consensus-excluded-keys deployment/ceremony/genesis/$LB_TARGET_ENV/consensus_excluded_keys.yaml \
            --template deployment/ceremony/genesis/$LB_TARGET_ENV/deployment-template.yaml \
            --output nodes/node/binary/src/config/deployment/settings.yaml

      - name: Export the ceremony output as a patch
        run: |
          git add nodes/node/binary/src/config/deployment/settings.yaml \
            nodes/node/binary/src/config/deployment/era/schedule

          if git diff --staged --quiet; then
            echo "Error: No changes detected in deployment.yaml. Genesis ceremony likely produced identical output."
            exit 1
          fi

          git diff --staged --binary > "$RUNNER_TEMP/genesis-ceremony.patch"

      - name: Upload the ceremony output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: genesis-ceremony-patch
          path: ${{ runner.temp }}/genesis-ceremony.patch
          if-no-files-found: error
          retention-days: 1

  # The only job that can push. It builds nothing: it applies the ceremony's patch to the commit the
  # ceremony ran on, so the push fails if the branch has moved since.
  commit:
    name: Commit Ceremony Output
    needs: genesis-ceremony
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      LB_TARGET_ENV: ${{ github.event.inputs.deployment }}
      LB_VERSION: ${{ github.event.inputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # Keeps the token in the Git configuration for the push below.
          persist-credentials: true

      - name: Download the ceremony output
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: genesis-ceremony-patch
          path: ${{ runner.temp }}/genesis-ceremony

      - name: Commit and Push changes
        run: |
          # Configure git with a generic bot identity
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Only the files the ceremony writes are taken from the patch.
          git apply --index \
            --include=nodes/node/binary/src/config/deployment/settings.yaml \
            --include='nodes/node/binary/src/config/deployment/era/schedule/*' \
            "$RUNNER_TEMP/genesis-ceremony/genesis-ceremony.patch"

          git commit -m "chore: genesis ceremony for $LB_TARGET_ENV version $LB_VERSION"
          git push

          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/$COMMIT_SHA"

          echo "### Deployment Updated Successfully" >> $GITHUB_STEP_SUMMARY
          echo "The changes have been pushed directly to the current branch." >> $GITHUB_STEP_SUMMARY
          echo "[View Commit on GitHub]($COMMIT_URL)" >> $GITHUB_STEP_SUMMARY

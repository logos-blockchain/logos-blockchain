name: Publish Logos Blockchain Node Docker Image

on:
  workflow_dispatch:
    inputs:
      lc_core_version:
        description: 'LC Core Version'
        required: false
        type: string
      lb_node_version:
        description: 'LB Node Version'
        required: true
        type: string
      lb_module_sha256:
        description: 'LB Module SHA256'
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/logos-blockchain-node
  LC_CORE_VERSION: ${{ inputs.lc_core_version }}
  LB_NODE_VERSION: ${{ inputs.lb_node_version }}
  LB_MODULE_SHA256: ${{ inputs.lb_module_sha256 }}
  VERSION_TAG: ${{ github.ref_name }}
  LATEST_TAG: ${{ contains(github.ref_name, '-rc.') && 'latest-rc' || 'latest' }}

jobs:
  push_to_registries:
    name: Push Docker image to multiple registries
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      # Fails before the long multi-platform build, which checks the package against it.
      - name: Check the module SHA-256
        run: |
          if ! [[ "$LB_MODULE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::LB Module SHA256 must be the SHA-256 of the blockchain_module package, as 64 lowercase hexadecimal digits."
            exit 1
          fi

      - name: Check out the repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # The checkout is the Docker build context, `.git` included, so the token must not be stored in it.
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: docker-container
          install: true

      - name: Log in to the Container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push multi-platform Docker images
        id: push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            LC_CORE_VERSION=${{ env.LC_CORE_VERSION }}
            LB_NODE_VERSION=${{ env.LB_NODE_VERSION }}
            LB_MODULE_SHA256=${{ env.LB_MODULE_SHA256 }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

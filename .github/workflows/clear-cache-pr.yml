name: Clear GitHub Runner caches on PR close

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  clear-caches:
    # Pull requests from forks get a read-only token, which cannot delete caches.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # The action is taken from the default branch: the pull request's merge ref can be gone once it is
      # closed.
      - name: Checkout prune action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/prune-cache
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Every cache saved on the pull request's ref, whatever saved it: only the pull request's own runs
      # can restore them. `./` rather than `$/` on purpose: it runs the default branch's action, checked
      # out above, not the one of the pull request's last commit.
      - name: Prune the pull request's caches
        uses: ./.github/actions/prune-cache # zizmor: ignore[self-repository]
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          key-prefix: ""
          ref: ${{ github.ref }}

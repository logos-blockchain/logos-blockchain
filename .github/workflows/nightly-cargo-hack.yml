on:
  push:
    branches:
      - master
  workflow_dispatch: # Allow manual triggering

name: Cargo Hack

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  features:
    name: Check packages feature combinations
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Using self-hosted runners because we were running out of memory on GitHub-hosted runners
          - os: [ self-hosted, Linux ]
            label: self-hosted-linux
          - os: [ self-hosted, macOS ]
            label: self-hosted-macos
    runs-on: ${{ matrix.platform.os }}
    steps:
      # Disable rustup override before checkout, so the toolchain state is clean before any workspace files or
      # .rust-toolchain.toml are present. Prevents a stale override from affecting the toolchain resolution during
      # checkout or subsequent steps.
      - name: Disable rustup override
        run: rustup override unset || true

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install cargo-hack
        uses: taiki-e/install-action@5651179950649c44da31d346537e20c0534f0f25  # v2.49.35
        with:
          tool: cargo-hack

      # Prune after Install cargo-hack, before Set up Cargo cache — frees disk space from the previous run's leftover
      # artifacts (incremental compile dirs, fingerprints, build dirs) before the cache is restored. This means the
      # restored cache lands onto a disk that has already been cleaned, maximizing the chance the restore succeeds
      # without hitting disk limits.
      - name: Prune disk space (cache-aware, self-hosted)
        uses: $/.github/actions/prune-disk-space

      - name: Set up Cargo cache
        uses: $/.github/actions/setup-cargo-cache
        with:
          key-prefix: cargo-hack/${{ matrix.platform.label }}

      - name: Run Cargo Hack Check (Cache-Aware)
        uses: $/.github/actions/cargo-hack-check-cached

      - name: Update Cargo cache
        if: success() || failure()
        uses: $/.github/actions/update-cargo-cache
        with:
          key-prefix: cargo-hack/${{ matrix.platform.label }}

      - name: Clean up build artifacts
        if: success() || failure()
        run: cargo clean

  # Deletes the caches that `features` superseded, in a job of its own like `prune-lint-caches` in
  # `code-check.yml`: deleting caches needs `actions: write`, and `features` compiles third-party code.
  prune-caches:
    name: Prune Cargo caches
    needs: [ features ]
    # `update-cargo-cache` saves a cache only on master.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # The key prefixes are the ones of `features`, with a trailing slash so that no other label matches.
      - name: Prune Cargo caches (self-hosted-linux)
        uses: $/.github/actions/prune-cache
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          key-prefix: cargo-hack/self-hosted-linux/main/
          mode: keep-latest

      - name: Prune Cargo caches (self-hosted-macos)
        uses: $/.github/actions/prune-cache
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          key-prefix: cargo-hack/self-hosted-macos/main/
          mode: keep-latest

  report:
    name: Report failures
    needs: [ features ]
    if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [ self-hosted, Linux ]
    permissions:
      # Lists this run's jobs and reads the commit's author.
      actions: read
      contents: read
      # Opens or comments on the failure issue.
      issues: write
    steps:
      - name: Create or update failure issue
        run: |
          FAILED_PLATFORMS=$(nix run 'nixpkgs#gh' -- api \
            /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')

          TITLE="[CI GENERATED] Cargo Hack failed"
          EXISTING_ISSUE=$(nix run 'nixpkgs#gh' -- issue list --search "$TITLE" --state open --json number --jq '.[0].number')

          COMMIT_AUTHOR=$(nix run 'nixpkgs#gh' -- api \
            /repos/${{ github.repository }}/commits/${{ github.sha }} \
            --jq '.author.login // empty' 2>/dev/null || true)

          BODY="Cargo Hack check failed for the following platforms: $FAILED_PLATFORMS
          See details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -z "$EXISTING_ISSUE" ]; then
            nix run 'nixpkgs#gh' -- issue create --title "$TITLE" --body "$BODY" --label "bug" --assignee "$COMMIT_AUTHOR"
          else
            nix run 'nixpkgs#gh' -- issue comment "$EXISTING_ISSUE" --body "Another failure occurred: $BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

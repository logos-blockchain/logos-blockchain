name: Build and Publish Logos Tools Docker Images (Kaniko)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to use"
        required: true
        default: "devnet"
      custom_version:
        description: "Optional version tag"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.platform }} image
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
          - platform: linux/arm64

    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Print run info
        run: |
          echo "Building Logos tools image for ${{ matrix.platform }} with tag: ${{ inputs.tag }}"
          if [ -n "${{ inputs.custom_version }}" ]; then
            echo "Applying custom version tag: ${{ inputs.custom_version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Applying git version tag: ${{ env.VERSION_TAG }}"
          fi

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and Push with Kaniko
        run: |
          # 1. Configure Kaniko Authentication locally in the workspace
          mkdir -p ${{ github.workspace }}/kaniko-config
          AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64)
          echo "{\"auths\":{\"${{ env.REGISTRY }}\":{\"auth\":\"$AUTH\"}}}" > ${{ github.workspace }}/kaniko-config/config.json

          # 2. Format tags for Kaniko arguments
          DESTINATION_ARGS=""
          for tag in ${{ steps.meta.outputs.tags }}; do
            DESTINATION_ARGS="$DESTINATION_ARGS --destination $tag"
          done

          # 3. Execute Kaniko inside an ephemeral Docker container
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/kaniko-config:/kaniko/.docker \
            gcr.io/kaniko-project/executor:latest \
            --context /workspace \
            --dockerfile /workspace/deployment/Dockerfile \
            $DESTINATION_ARGS \
            --customPlatform ${{ matrix.platform }} \
            --digest-file /workspace/digest.txt

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          # Read the digest Kaniko just generated in the workspace
          DIGEST=$(cat ${{ github.workspace }}/digest.txt)
          echo "DIGEST=$DIGEST" >> $GITHUB_ENV

          # Create the empty digest file for the manifest job artifact
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

  manifest:
    name: Create multi-arch manifest
    needs: build
    runs-on: [self-hosted, Linux, X64]

    permissions:
      packages: write
      contents: read

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # Download standalone Buildx binary to stitch the manifest daemonlessly
      - name: Set up Docker Buildx (Standalone)
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -sLo ~/.docker/cli-plugins/docker-buildx https://github.com/docker/buildx/releases/download/v0.15.1/buildx-v0.15.1.linux-amd64
          chmod +x ~/.docker/cli-plugins/docker-buildx

      - name: Log in to the Container registry
        run: |
          # Requires Docker CLI on the host, but does not require the Docker daemon/socket
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAGS="-t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}"

          if [ -n "${{ inputs.custom_version }}" ]; then
            TAGS="$TAGS -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.custom_version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}"
          fi

          # imagetools create talks directly to the remote registry via REST, no daemon needed
          docker buildx imagetools create $TAGS $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}

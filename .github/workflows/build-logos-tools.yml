name: Build and Publish Logos Tools Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to use"
        required: true
        default: "devnet"
      custom_version:
        description: "Optional version tag"
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.platform }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Print run info
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ inputs.tag }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          echo "Building Logos tools image for $PLATFORM with tag: $TAG"
          if [ -n "$CUSTOM_VERSION" ]; then
            echo "Applying custom version tag: $CUSTOM_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            echo "Applying git version tag: $VERSION_TAG"
          fi

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Check out the repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # The checkout is the Docker build context, `.git` included, so the token must not be stored in it.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: docker-container
          install: true

      - name: Log in to the Container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./deployment/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  manifest:
    name: Create multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      packages: write
      contents: read

    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to the Container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ inputs.tag }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          IMAGE="$REGISTRY/$IMAGE_NAME"
          TAGS=(-t "$IMAGE:$TAG")
          if [ -n "$CUSTOM_VERSION" ]; then
            TAGS+=(-t "$IMAGE:$CUSTOM_VERSION")
          elif [ "$REF_TYPE" = "tag" ]; then
            TAGS+=(-t "$IMAGE:$VERSION_TAG")
          fi

          # One file per platform image, named after its digest.
          SOURCES=()
          for digest in *; do
            SOURCES+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${TAGS[@]}" "${SOURCES[@]}"

      - name: Inspect image
        env:
          TAG: ${{ inputs.tag }}
        run: docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:$TAG"

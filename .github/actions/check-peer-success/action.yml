name: Check peer success
description: Stop this lane cooperatively when its peer has fully passed

inputs:
  github-token:
    description: Token used to inspect jobs in the current workflow run
    required: true
  current-label:
    description: Label identifying the current matrix lane
    required: true
  peer-label:
    description: Label identifying the other matrix lane
    required: true
  job-name-prefix:
    description: Job name before the matrix label
    required: true

runs:
  using: composite
  steps:
    - name: Check whether peer lane passed
      shell: bash
      env:
        PEER_CHECK_TOKEN: ${{ inputs.github-token }}
        CURRENT_LABEL: ${{ inputs.current-label }}
        PEER_LABEL: ${{ inputs.peer-label }}
        JOB_NAME_PREFIX: ${{ inputs.job-name-prefix }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import time
        import urllib.parse
        import urllib.request


        def warning(message):
            # Prevent unexpected response text from creating another workflow command.
            message = (
                message.replace("%", "%25")
                .replace("\r", "%0D")
                .replace("\n", "%0A")
            )
            print(f"::warning::{message}")


        def fetch_jobs():
            api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com")
            repository = os.environ["GITHUB_REPOSITORY"]
            run_id = os.environ["GITHUB_RUN_ID"]
            query = urllib.parse.urlencode(
                {"filter": "latest", "per_page": 100}
            )
            url = (
                f"{api_url}/repos/{repository}/actions/runs/"
                f"{run_id}/jobs?{query}"
            )
            request = urllib.request.Request(
                url,
                headers={
                    "Authorization": (
                        f"Bearer {os.environ['PEER_CHECK_TOKEN']}"
                    ),
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28",
                    "User-Agent": "check-peer-success",
                },
            )

            attempts = 3
            for attempt in range(1, attempts + 1):
                try:
                    with urllib.request.urlopen(
                        request, timeout=15
                    ) as response:
                        return json.load(response).get("jobs", [])
                except Exception as error:
                    if attempt == attempts:
                        warning(
                            "Could not check peer job after "
                            f"{attempts} attempts; continuing this lane: "
                            f"{error}"
                        )
                        return None

                    delay = 5 * attempt
                    print(
                        f"Peer-job check attempt {attempt}/{attempts} "
                        f"failed; retrying in {delay}s: {error}"
                    )
                    time.sleep(delay)

            return None


        try:
            peer_name = (
                f"{os.environ['JOB_NAME_PREFIX']} "
                f"({os.environ['PEER_LABEL']})"
            )
            jobs = fetch_jobs()

            if jobs is not None:
                peer = next(
                    (
                        job
                        for job in jobs
                        if job.get("name") == peer_name
                    ),
                    None,
                )
                peer_reported_success = (
                    peer is not None
                    and peer.get("status") == "completed"
                    and peer.get("conclusion") == "success"
                    and any(
                        step.get("name") == "Report success"
                        and step.get("conclusion") == "success"
                        for step in peer.get("steps") or []
                    )
                )

                if peer_reported_success:
                    current_label = os.environ["CURRENT_LABEL"]
                    print(
                        f"::notice::{peer_name} passed; skipping the "
                        f"remaining work on {current_label}"
                    )
                    with open(
                        os.environ["GITHUB_ENV"],
                        "a",
                        encoding="utf-8",
                    ) as env_file:
                        env_file.write("PEER_SUCCEEDED=true\n")
        except Exception as error:
            warning(
                f"Could not check peer job; continuing this lane: {error}"
            )
        PY

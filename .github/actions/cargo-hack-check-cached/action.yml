name: Cargo Hack Check (Cache-Aware)


description: Runs cargo hack check with cache support


inputs:
  cache-directory:
    description: The directory to cache the cargo-hack keys in
    required: false
    default: ./.cache/cargo-hack-check


# Cache keys are content-addressed, so restoring keys saved by any other ref can only cause cache misses, never false
# passes. Runs on any ref restore their own latest keys first and fall back to master's.
runs:
  using: composite
  steps:
    - name: Restore Cargo Hack Keys
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # Version 4.2.3
      continue-on-error: true
      with:
        path: ${{ inputs.cache-directory }}
        key: cargo-hack-check/${{ runner.os }}/${{ github.ref_name }}/${{ github.sha }}
        restore-keys: |
          cargo-hack-check/${{ runner.os }}/${{ github.ref_name }}/
          cargo-hack-check/${{ runner.os }}/master/

    - name: Run Cache-Aware Cargo Hack Check
      shell: bash
      env:
        CARGO_BUILD_WARNINGS: deny
      run: python3 ./scripts/cargo-hack-check/script.py --continue-on-failure

    # Saved even on failure, so crates that passed keep their keys.
    - name: Save Cargo Hack Keys
      if: always()
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # Version 4.2.3
      with:
        path: ${{ inputs.cache-directory }}
        key: cargo-hack-check/${{ runner.os }}/${{ github.ref_name }}/${{ github.sha }}

    swarm:
      host: 0.0.0.0
      port: 3000
      node_key: e01039077e592ce1c454c5e8ffe2f571f6fad6106ff0e1895c9a403c126ba80f
      gossipsub:
        history_length: 5
        history_gossip: 3
        mesh_n: 6
        mesh_n_low: 5
        mesh_n_high: 12
        retain_scores: 4
        gossip_lazy: 6
        gossip_factor: 0.25
        heartbeat_initial_delay:
          secs: 5
          nanos: 0
        heartbeat_interval:
          secs: 1
          nanos: 0
        fanout_ttl:
          secs: 60
          nanos: 0
        check_explicit_peers_ticks: 300
        duplicate_cache_time:
          secs: 60
          nanos: 0
        validate_messages: false
        allow_self_origin: false
        do_px: false
        prune_peers: 0
        prune_backoff:
          secs: 60
          nanos: 0
        unsubscribe_backoff:
          secs: 10
          nanos: 0
        backoff_slack: 1
        flood_publish: true
        graft_flood_threshold:
          secs: 10
          nanos: 0
        mesh_outbound_min: 2
        opportunistic_graft_ticks: 60
        opportunistic_graft_peers: 2
        gossip_retransimission: 3
        max_messages_per_rpc: null
        max_ihave_length: 5000
        max_ihave_messages: 10
        iwant_followup_time:
          secs: 3
          nanos: 0
        published_message_ids_cache_time:
          secs: 10
          nanos: 0
      kademlia:
        query_timeout_secs: null
        replication_factor: null
        parallelism: null
        disjoint_query_paths: null
        max_packet_size: null
        kbucket_inserts: null
        caching: null
        periodic_bootstrap_interval_secs: null
      identify:
        agent_version: null
        interval_secs: null
        push_listen_addr_updates: null
        cache_size: null
        hide_listen_addrs: true
      chain_sync:
        peer_response_timeout: 5000
        max_inbound_requests: 10
      nat:
        type: traversal
        autonat:
          max_candidates: null
          probe_interval_millisecs: null
          retest_successful_external_addresses_interval:
            secs: 60
            nanos: 0
        mapping:
          timeout: '1.000000000'
          lease_duration:
            secs: 7200
            nanos: 0
          max_retries: 3
          renewal_delay_fraction: 0.8
          retry_interval:
            secs: 30
            nanos: 0
        gateway_monitor:
          check_interval:
            secs: 300
            nanos: 0
    initial_peers: []
blend:
  non_ephemeral_signing_key_id: BlendSigning
  core:
    backend:
      listening_address: /ip4/0.0.0.0/udp/3400/quic-v1
      max_dial_attempts_per_peer: 3
    zk:
      secret_key_kms_id: BlendZk
  edge:
    backend:
      max_dial_attempts_per_peer_per_message: 1
      replication_factor: 1
cryptarchia:
  service:
    bootstrap:
      prolonged_bootstrap_period: '5.000000000'
      force_bootstrap: false
      offline_grace_period:
        grace_period: '5.000000000'
        state_recording_interval: '60.000000000'
    sync:
      block_provider:
        batch_size: 1000
  network:
    bootstrap:
      ibd:
        peers: []
        delay_before_new_download:
          secs: 10
          nanos: 0
        tips_fetch_max_attempts: 3
        tips_fetch_min_delay:
          secs: 0
          nanos: 250000000
        tips_fetch_max_delay:
          secs: 1
          nanos: 0
        round_delay:
          secs: 1
          nanos: 0
    sync:
      orphan:
        max_orphan_cache_size: 1000
        max_rejected_cache_size: 1000
    network:
      max_connected_peers_to_try_download: 16
      max_discovered_peers_to_try_download: 16
  leader:
    wallet:
      max_tx_fee: 18446744073709551615
time:
  backend:
    server: pool.ntp.org:123
    client:
      timeout: '5.000000000'
      listening_interface: 0.0.0.0
    update_interval: '15.000000000'
sdp:
  declaration_id: null
  wallet:
    max_tx_fee: 18446744073709551615
  active_message_tracker:
    status_check_interval_in_tip_changes: 3
api:
  backend:
    listen_address: 127.0.0.1:8080
    cors_origins: []
    timeout: 30
    max_body_size: 10485760
    max_concurrent_requests: 500
storage:
  backend:
    folder_name: ./db
    read_only: false
    column_family: blocks
kms:
  backend:
    mnemonic: abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about
    keys:
      BlendSigning: !Ed25519 72ca8bacc83363ed2fc9ec8e79361c5389c872d3e2952de439fcf9721b1f498a
      BlendZk: !Zk 1a66f6ab42521b1ac82784e2e2d3abd2fb49e5e3312a2b5fc2ef9d3ecf365c16
      NetworkSwarm: !Ed25519 e01039077e592ce1c454c5e8ffe2f571f6fad6106ff0e1895c9a403c126ba80f
wallet:
  known_keys:
    - BlendSigning
    - BlendZk
    - NetworkSwarm
  # The first receive index that funding spends from.
  # The wallet never spends from index below this value.
  # Addresses that should not be spent (such as stake) should use indices below this value.
  funding_start_index: 1
pow:
  auto_claim:
    # How often to try claiming: `seconds` paces off the wall clock, `slots`
    # off chain progress.
    tick:
      unit: seconds
      value: 300
    # Total spendable balance the wallet should reach. Auto-claim pays mined
    # rewards to the next receive address of the wallet while the total spendable
    # balance of the wallet is below the threshold. Null means claims only happen
    # on demand, through `POST /pow/claim`.
    threshold: null
tracing:
  logger:
    file:
      directory: .
      prefix: '1780937654'
      appender_type: Simple
    loki: null
    gelf: null
    otlp: null
    stdout: true
    stderr: false
  tracing: None
  filter: !Env
    filters:
      reqwest: WARN
      libp2p_gossipsub: ERROR
      h2: WARN
      hyper: WARN
      tower: WARN
      tonic: WARN
      opentelemetry_sdk: WARN
      rustls: WARN
      '*': WARN
      opentelemetry: WARN
      logos_blockchain: DEBUG
      hyper_util: WARN
  metrics: None
  console: None
  level: "INFO"
state:
  base_folder: ./state

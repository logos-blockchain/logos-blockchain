pow:
  auto_claim:
    # How often to try claiming: `seconds` paces off the wall clock, `slots`
    # off chain progress.
    tick:
      unit: seconds
      value: 10
    # Keys mined rewards are paid to, each with the balance it should reach.
    # Auto-claim pays whichever listed key currently holds the least while
    # still being below its threshold, and stops once all of them are
    # satisfied. Every key here must also appear in `wallet.known_keys`, or the
    # node refuses to start. Empty means claims only happen on demand, through
    # `POST /pow/claim`.
    targets: [ ]

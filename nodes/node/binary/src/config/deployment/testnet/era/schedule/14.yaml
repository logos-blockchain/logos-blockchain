# The era the testnet moves to at epoch 14, slot 4,200,000, which is
# 2026-11-27T05:10:00Z: the rules of release 0.4, with the parameters of
# `deployment/ceremony/genesis/testnet/deployment-template.yaml` but for:
# - the security parameter, the Blend PoW's target transactions per block, the
#   target PoW reward claims per block and the claim acceptance window, which
#   stay as the genesis era set them,
# - the EmPoWering pool and payout rate, and the block rewards, sized for the
#   stake of this chain and a run to the end of January 2027.
# A test schedule: nodes of releases 0.3.1 to 0.3.6 do not follow the chain
# past it.
!V2
blend:
  common:
    num_blend_layers: 1
    minimum_network_size: 2
    network_absorption_in_rounds: 2
    data_replication_factor: 1
  core:
    scheduler:
      cover:
        message_frequency_per_round:
          numerator: 1
          denominator: 1
        replication_factor: 0
      delayer:
        maximum_release_delay_in_rounds: 1
    target_peering_degree: 4
    verification_rate_per_second: 156
    edge_node_send_deadline_in_rounds: 1
    core_handshake_deadline_in_rounds: 2
    expected_deliveries_per_observation_window: 60
    activity_threshold_sensitivity: 1
cryptarchia:
  epoch_config:
    epoch_stake_distribution_stabilization: 3
    epoch_period_nonce_buffer: 3
    epoch_period_nonce_stabilization: 4
  security_param: 1000
  slot_activation_coeff:
    numerator: 1
    denominator: 30
  learning_rate: 1.0
  uncle_reference_window_in_block: 12
  max_uncles: 4
  max_transactions: 1024
  # The most bytes a block's transactions may take, 2 MiB. An inscription or a
  # deposit's metadata may take seven eighths of it.
  max_transactions_size: 2097152
  pow_config:
    blend:
      # BLEND_DIFFICULTY_BASE, as the exponent n in p / 2^n: the Blend PoW
      # threshold at the reference load. Fixed by the EmPoWering
      # specification from a measurement on the target hardware itself
      # (Raspberry Pi 5, one core), at which one solution is around fifty
      # seconds of work.
      base_difficulty: 19
      # The reference load the threshold is calibrated at: kept as the genesis
      # era set it.
      target_transactions_per_block: 12
      max_step: 2
      damping_num: 1
      damping_den_offset: 1
    reward:
      # Token-reward PoW parameters, sized for the target network of ~200
      # mining nodes over the two-week epoch schedule.
      # Genesis `d_reward`, as the exponent n in p / 2^n — the same form as
      # the Blend `base_difficulty` above. Fixed by the specification.
      # Also the minimum difficulty: the retarget never eases past it.
      minimum_difficulty: 19
      ema_smoothing_factor: 9
      ema_smoothing_precision: 10
      # Kept as the genesis era set it. The payout rate counts on it: an
      # epoch whose blocks carry that many claims each pays out rho of the
      # pool.
      target_claims_per_block: 10
      # rho = rate_num / rate_den = 1/26 of the pool per epoch. An epoch is
      # 300,000 slots, about three and a half days: after 30 days about seven
      # tenths of the pool this era starts with is left, and after 65 days
      # about half.
      rate_num: 1
      rate_den: 26
      # `pow_share / share_den` of the fees each block collects is
      # diverted to the pow reward pool at the epoch boundary.
      pow_share: 10
      share_den: 100
      # Acceptance window in slots; must match the mining service. Kept as
      # the genesis era set it: twenty block-intervals of tolerance for a
      # claim to reach a block.
      slot_window: 600
  sdp_config:
    # One entry per service type, in the order they are declared: the Blend
    # network.
    service_params:
      - inactivity_period: 2
    min_stake:
      threshold: 1000000000
  # The execution market: the most execution gas a block may consume, G_max,
  # whose half is the target, the fee adjustment rate φ and the EMA smoothing
  # factor q.
  execution_market:
    max_gas_per_block: 3193460
    fee_adjustment_rate:
      numerator: 1
      denominator: 8
    ema_smoothing_factor:
      numerator: 9
      denominator: 10
  # The storage market: the max adjustment factor α and the EMA smoothing factor
  # β.
  storage_market:
    max_adjustment_factor:
      numerator: 1
      denominator: 8
    ema_smoothing_factor:
      numerator: 1
      denominator: 2
  # The block rewards: the stake target, the scale of the emission's weight, the
  # weight of the pooled fees, a block's emission in full, and the Blend nodes'
  # share of a reward, the leader taking the rest.
  #
  # The genesis era's stake target is far below the chain's stake, which
  # leaves a block's reward at its fee. This era emits: 200,000,000 a block
  # while the stake is below 80,000,000,000,000, then less with each token of
  # stake, down to nothing at the target of 100,000,000,000,000.
  block_rewards:
    stake_target: 100000000000000
    emission_factor_scale: 20000000000000
    fee_average_numerator: 10512
    max_emission_per_block:
      numerator: 200000000
      denominator: 1
    blend_share:
      numerator: 6
      denominator: 10
  # The execution gas of each Operation; the channel configuration, withdrawal
  # and transfer cost theirs per key of the channel's threshold.
  gas_profile:
    transfer: 590
    channel_config: 56
    channel_inscribe: 56
    channel_deposit: 590
    channel_withdraw: 56
    channel_transfer: 56
    sdp_declare: 646
    sdp_withdraw: 590
    sdp_active: 590
    leader_claim: 580
    claim_pow_reward: 1
  # The EmPoWering reward pool the era starts with, replacing what the
  # genesis era left of its own: about twice the stake the chain started with,
  # so that what is mined in the era's first two months is about that stake.
  pow_reward_pool: 50000000000000
time:
  slot_duration_in_seconds: 1

# What releases 0.3.1 to 0.3.6 fixed in code, and release 0.4 made parameters of
# an era: the values the chain they started ran under, in the layout of the
# ruleset that follows it.

# The execution market: the most execution gas a block may consume, the fee
# adjustment rate and the EMA smoothing factor.
execution_market:
  max_gas_per_block: 3193460
  fee_adjustment_rate:
    numerator: 1
    denominator: 8
  ema_smoothing_factor:
    numerator: 9
    denominator: 10
# The storage market: the max adjustment factor and the EMA smoothing factor.
storage_market:
  max_adjustment_factor:
    numerator: 1
    denominator: 8
  ema_smoothing_factor:
    numerator: 1
    denominator: 2
block_rewards:
  stake_target: 3000000000
  emission_factor_scale: 120000000
  fee_average_numerator: 10512
  max_emission_per_block:
    numerator: 62500
    denominator: 657
  blend_share:
    numerator: 6
    denominator: 10
# The execution gas of each Operation; the channel configuration, withdrawal
# and transfer cost theirs per key of the channel's threshold.
gas_profile:
  transfer: 590
  channel_config: 56
  channel_inscribe: 56
  channel_deposit: 590
  channel_withdraw: 56
  channel_transfer: 56
  sdp_declare: 646
  sdp_withdraw: 590
  sdp_active: 590
  leader_claim: 580
  claim_pow_reward: 1

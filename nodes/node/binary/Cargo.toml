[package]
categories  = { workspace = true }
description = { workspace = true }
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-blockchain-node"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[package.metadata.cargo-machete]
# False positives.
ignored = [
  # Required by `wait_until_services_are_ready` macro.
  "futures",
]

[lints]
workspace = true

[dependencies]
async-trait                                    = "0.1"
clap                                           = { default-features = false, features = ["derive", "env", "std"], version = "4" }
color-eyre                                     = { default-features = false, version = "0.6.0" }
derivative                                     = { version = "2", default-features = false }
futures                                        = { default-features = false, version = "0.3" }
hex                                            = { default-features = false, version = "0.4.3" }
http                                           = "1.3"
logos-blockchain-api-service                   = { workspace = true }
logos-blockchain-blend                         = { workspace = true }
logos-blockchain-blend-service                 = { features = ["libp2p"], workspace = true }
logos-blockchain-chain-broadcast-service       = { workspace = true }
logos-blockchain-chain-leader-service          = { workspace = true }
logos-blockchain-chain-network-service         = { workspace = true, features = ["libp2p"] }
logos-blockchain-chain-service                 = { workspace = true }
logos-blockchain-core                          = { workspace = true }
logos-blockchain-cryptarchia-engine            = { workspace = true }
logos-blockchain-da-messages                   = { workspace = true }
logos-blockchain-da-network-core               = { workspace = true }
logos-blockchain-da-network-service            = { workspace = true }
logos-blockchain-da-sampling-service           = { features = ["libp2p", "rocksdb-backend"], workspace = true }
logos-blockchain-da-verifier-service           = { features = ["libp2p"], workspace = true }
logos-blockchain-groth16                       = { workspace = true }
logos-blockchain-http-api-common               = { workspace = true }
logos-blockchain-key-management-system-service = { workspace = true }
logos-blockchain-kzgrs-backend                 = { workspace = true }
logos-blockchain-ledger                        = { workspace = true }
logos-blockchain-libp2p                        = { workspace = true }
logos-blockchain-network-service               = { workspace = true }
logos-blockchain-pol                           = { workspace = true }
logos-blockchain-poq                           = { workspace = true }
logos-blockchain-sdp-service                   = { workspace = true }
logos-blockchain-services-utils                = { workspace = true }
logos-blockchain-storage-service               = { workspace = true }
logos-blockchain-subnetworks-assignations      = { workspace = true }
logos-blockchain-system-sig-service            = { workspace = true }
logos-blockchain-time-service                  = { features = ["ntp", "serde"], workspace = true }
logos-blockchain-tracing                       = { workspace = true }
logos-blockchain-tracing-service               = { workspace = true }
logos-blockchain-tx-service                    = { features = ["rocksdb-backend"], workspace = true }
logos-blockchain-utils                         = { workspace = true, features = ["serde"] }
logos-blockchain-wallet                        = { workspace = true }
num-bigint                                     = { default-features = false, version = "0.4" }
overwatch                                      = { workspace = true }
serde                                          = { workspace = true }
serde_ignored                                  = { workspace = true }
serde_json                                     = { workspace = true }
serde_with                                     = { default-features = false, version = "3.14.0" }
serde_yaml                                     = { workspace = true }
thiserror                                      = { workspace = true }
tokio                                          = "1"
tokio-stream                                   = { default-features = false, version = "0.1" }
tracing                                        = { workspace = true }

# openapi related dependencies
utoipa = { workspace = true }
# utoipa-swagger-ui = { features = ["axum"], workspace = true }

# axum related dependencies
axum       = { default-features = false, features = ["http1", "http2", "json", "query", "tokio"], version = "0.7.5" }
time       = { default-features = false, version = "0.3" }
tower      = { default-features = false, features = ["limit"], version = "0.4" }
tower-http = { default-features = false, features = ["cors", "limit", "timeout", "trace"], version = "0.5" }

[target.'cfg(windows)'.dependencies]
# XCompiling from Unix has issues downloading assets. Use vendored instead.
# This happens locally but might not on CI.
utoipa-swagger-ui = { workspace = true, features = ["axum", "vendored"] }

[target.'cfg(not(windows))'.dependencies]
utoipa-swagger-ui = { workspace = true, features = ["axum"] }

[dev-dependencies]
test-log = { default-features = false, version = "0.2.18", features = ["trace"] }

[features]
block-explorer  = ["logos-blockchain-api-service/block-explorer"]
default         = ["tracing"]
instrumentation = []
profiling       = ["logos-blockchain-http-api-common/profiling", "logos-blockchain-tracing-service/profiling"]
testing         = ["logos-blockchain-key-management-system-service/unsafe"]
tracing         = []

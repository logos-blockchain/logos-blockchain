[package]
categories  = { workspace = true }
description = { workspace = true }
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-blockchain-node"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[package.metadata.cargo-machete]
# False positives.
ignored = [
  # Required by `wait_until_services_are_ready` macro.
  "futures",
]

[lints]
workspace = true

[dependencies]
logos-blockchain-blockchain-blockchain-blockchain-blockchain-da-sampling = { features = [
logos-blockchain-p2p",
  "rocksdb-backend",
], workspace = true }
logos-blockchain-blockchain-blockchain-blockchain-core = { workspace = true }
logos-blockchain-da-verifier = { features = ["libp2p"], workspace = true }
logos-blockchain-http-api-common = { workspace = true }
logos-blockchain-ledger = { workspace = true }
logos-blockchain-libp2p = { workspace = true }
logos-blockchain-network = { workspace = true }
logos-blockchain-sdp = { workspace = true }
logos-blockchain-storage = { workspace = true }
logos-blockchain-system-sig = { workspace = true }
logos-blockchain-time = { features = ["ntp", "serde"], workspace = true }
logos-blockchain-tracing = { workspace = true }
logos-blockchain-tracing-service = { workspace = true }
logos-blockchain-utils = { workspace = true, features = ["serde"] }
logos-blockchain-wallet = { workspace = true }
num-bigint = { default-features = false, version = "0.4" }
overwatch = { workspace = true }
pol = { workspace = true }
poq = { workspace = true }
logos-blockchain-blockchain-= { workspace = true }
serde_ignored = { workspace = true }
serde_json = { workspace = true }
serde_with = { default-features = false, version = "3.14.0" }
serde_yaml = { workspace = true }
services-utils = { workspace = true }
subnetworks-assignations = { workspace = true }
thiserror = { workspace = true }
tokio = "1"
tokio-stream = { default-features = false, version = "0.1" }
tracing = { workspace = true }
tx-service = { features = ["rocksdb-backend"], workspace = true }

# openapi related dependencies
utoipa = { workspace = true }
# utoipa-swagger-ui = { features = ["axum"], workspace = true }

# axum related dependencies
axum       = { default-features = false, features = ["http1", "http2", "json", "query", "tokio"], version = "0.7.5" }
time       = { default-features = false, version = "0.3" }
tower      = { default-features = false, features = ["limit"], version = "0.4" }
tower-http = { default-features = false, features = ["cors", "limit", "timeout", "trace"], version = "0.5" }

[target.'cfg(windows)'.dependencies]
# XCompiling from Unix has issues downloading assets. Use vendored instead.
# This happens locally but might not on CI.
utoipa-swagger-ui = { workspace = true, features = ["axum", "vendored"] }

[target.'cfg(not(windows))'.dependencies]
utoipa-swagger-ui = { workspace = true, features = ["axum"] }

[dev-dependencies]
test-log = { default-features = false, version = "0.2.18", features = ["trace"] }

[features]
block-explorer  = ["logos-blockchain-api/block-explorer"]
default         = ["tracing"]
instrumentation = []
profiling       = ["logos-blockchain-http-api-common/profiling", "logos-blockchain-tracing-service/profiling"]
testing         = ["key-management-system-service/unsafe"]
tracing         = []async-trait                                                                     = "0.1"
broadcast-service                                                               = { workspace = true }
chain-leader                                                                    = { workspace = true }
chain-network                                                                   = { workspace = true, features = ["libp2p"] }
chain-service                                                                   = { workspace = true }
clap                                                                            = { default-features = false, features = ["derive", "env", "std"], version = "4" }
color-eyre                                                                      = { default-features = false, version = "0.6.0" }
cryptarchia-engine                                                              = { workspace = true }
derivative                                                                      = { version = "2", default-features = false }
futures                                                                         = { default-features = false, version = "0.3" }
groth16                                                                         = { workspace = true }
hex                                                                             = { default-features = false, version = "0.4.3" }
http                                                                            = "1.3"
key-management-system-service                                                   = { workspace = true }
kzgrs-backend                                                                   = { workspace = true }
logos-blockchain-api                                                            = { workspace = true }
logos-blockchain-blend-service                                                  = { features = ["libp2p"], workspace = true }
logos-blockchain-blockchain-blockchain-blend                                    = { workspace = true }
logos-blockchain-blockchain-blockchain-blockchain-blockchain-da-messages        = { workspace = true }
logos-blockchain-blockchain-blockchain-blockchain-blockchain-da-network-core    = { workspace = true }
logos-blockchain-blockchain-blockchain-blockchain-blockchain-da-network-service = { workspace = true }

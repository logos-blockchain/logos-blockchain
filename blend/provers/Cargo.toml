[package]
categories  = { workspace = true }
description = { workspace = true }
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-blockchain-blend-provers"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lints]
workspace = true

[dependencies]
async-trait                   = { workspace = true }
derivative                    = { workspace = true }
futures                       = { workspace = true }
hex                           = { workspace = true }
lb-blend-membership           = { workspace = true }
lb-blend-message              = { workspace = true }
lb-blend-proofs               = { workspace = true }
lb-core                       = { workspace = true }
lb-cryptarchia-engine         = { workspace = true }
lb-groth16                    = { workspace = true }
lb-key-management-system-keys = { workspace = true }
lb-log-targets                = { workspace = true }
lb-utils                      = { features = ["tokio"], workspace = true }
rand                          = { features = ["alloc"], workspace = true }
rayon                         = { workspace = true }
tokio                         = { workspace = true }
tracing                       = { workspace = true }

[dev-dependencies]
lb-blend-membership = { features = ["unsafe-test-functions"], workspace = true }
lb-blend-message    = { features = ["unsafe-test-functions"], workspace = true }
lb-blend-proofs     = { features = ["unsafe-test-functions"], workspace = true }
lb-groth16          = { workspace = true }
libp2p              = { workspace = true }
multiaddr           = { workspace = true }
test-log            = { features = ["trace"], workspace = true }

[features]
tokio-task-names      = ["lb-utils/tokio-task-names"]
unsafe-test-functions = []

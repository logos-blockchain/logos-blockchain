[package]
authors     = ["Daniel Sanchez Quiros <danielsq@status.im>"]
categories  = { workspace = true }
description = { workspace = true }
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-blockchain-core"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lints]
workspace = true

[dependencies]
ark-ff                        = { workspace = true }
bincode                       = { workspace = true }
bitvec                        = { workspace = true }
blake2                        = { workspace = true }
bytes                         = { workspace = true }
hex                           = { features = ["alloc"], workspace = true }
lb-binary-codec               = { workspace = true }
lb-blend-proofs               = { workspace = true }
lb-cryptarchia-engine         = { workspace = true }
lb-dynamic-merkle             = { workspace = true }
lb-groth16                    = { workspace = true }
lb-imt                        = { workspace = true }
lb-key-management-system-keys = { workspace = true }
lb-log-targets                = { workspace = true }
lb-mmr                        = { workspace = true }
lb-pol                        = { workspace = true }
lb-poseidon2                  = { workspace = true }
lb-program-spend              = { workspace = true }
lb-time                       = { workspace = true }
lb-utils                      = { workspace = true }
lb-utxotree                   = { workspace = true }
lb-zktransfer                 = { workspace = true }
multiaddr                     = { workspace = true }
num-bigint                    = { workspace = true }
rpds                          = { workspace = true }
serde                         = { features = ["derive"], workspace = true }
strum                         = { features = ["derive"], workspace = true }
thiserror                     = { workspace = true }
time                          = { workspace = true }
tracing                       = { workspace = true }
utoipa                        = { features = ["macros"], optional = true, workspace = true }

[dev-dependencies]
ark-groth16      = { workspace = true }
boon             = { workspace = true }
divan            = { workspace = true }
hasher           = { workspace = true }
lb-groth16       = { features = ["test-utils"], workspace = true }
lb-program-spend = { features = ["test-utils"], workspace = true }
lb-zktransfer    = { features = ["test-utils"], workspace = true }
rand             = { workspace = true }
serde_json       = { features = ["alloc"], workspace = true }
tokio            = { workspace = true }

[[bench]]
harness = false
name    = "mantle_tx_components"

[features]
openapi               = ["dep:utoipa", "lb-utils/openapi"]
test-utils            = []
unsafe-test-functions = []

[package]
categories  = { workspace = true }
description = { workspace = true }
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-blockchain-chain-service"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lints]
workspace = true

[dependencies]
async-trait                              = "0.1"
bytes                                    = { workspace = true }
futures                                  = { default-features = false, version = "0.3" }
logos-blockchain-chain-broadcast-service = { workspace = true }
logos-blockchain-core                    = { workspace = true }
logos-blockchain-cryptarchia-engine      = { features = ["serde"], workspace = true }
logos-blockchain-cryptarchia-sync        = { workspace = true }
logos-blockchain-groth16                 = { workspace = true }
logos-blockchain-ledger                  = { features = ["serde"], workspace = true }
logos-blockchain-network-service         = { workspace = true }
logos-blockchain-services-utils          = { workspace = true }
logos-blockchain-storage-service         = { workspace = true }
logos-blockchain-time-service            = { workspace = true, features = ["ntp"] }
logos-blockchain-utils                   = { workspace = true }
num-bigint                               = { default-features = false, version = "0.4" }
overwatch                                = { workspace = true }
serde                                    = { workspace = true }
serde_with                               = { workspace = true }
strum                                    = "0.27"
thiserror                                = "1.0"
tokio                                    = { default-features = false, version = "1" }
tracing                                  = { workspace = true }
tracing-futures                          = { default-features = false, features = ["std-future"], version = "0.2" }
utoipa                                   = { optional = true, workspace = true }

[dev-dependencies]
logos-blockchain-core                       = { features = ["mock"], workspace = true }
logos-blockchain-key-management-system-keys = { workspace = true }
logos-blockchain-network-service            = { features = ["mock"], workspace = true }
logos-blockchain-storage-service            = { features = ["rocksdb-backend"], workspace = true }
tempfile                                    = { default-features = false, version = "3" }

[features]
default                       = []
libp2p                        = ["logos-blockchain-network-service/libp2p"]
logos-blockchain-pol-dev-mode = ["logos-blockchain-core/pol-dev-mode"]
openapi                       = ["dep:utoipa"]

[package]
categories  = { workspace = true }
description = { workspace = true }
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-blockchain-chain-network-service"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lints]
workspace = true

[dependencies]
async-trait                           = "0.1"
futures                               = { default-features = false, version = "0.3" }
logos-blockchain-chain-service        = { workspace = true }
logos-blockchain-chain-service-common = { workspace = true }
logos-blockchain-core                 = { workspace = true }
logos-blockchain-cryptarchia-engine   = { features = ["serde"], workspace = true }
logos-blockchain-cryptarchia-sync     = { workspace = true }
logos-blockchain-da-sampling-service  = { workspace = true }
logos-blockchain-ledger               = { features = ["serde"], workspace = true }
logos-blockchain-network-service      = { workspace = true }
logos-blockchain-services-utils       = { workspace = true }
logos-blockchain-time-service         = { workspace = true }
logos-blockchain-tx-service           = { workspace = true }
overwatch                             = { workspace = true }
rand                                  = { default-features = false, version = "0.8" }
serde                                 = { default-features = false, version = "1" }
serde_with                            = { workspace = true }
thiserror                             = "1.0"
tokio                                 = { default-features = false, version = "1" }
tokio-stream                          = { default-features = false, version = "0.1" }
tracing                               = { workspace = true }
tracing-futures                       = { default-features = false, version = "0.2" }

[dev-dependencies]
logos-blockchain-core            = { features = ["mock"], workspace = true }
logos-blockchain-network-service = { features = ["mock"], workspace = true }
logos-blockchain-utils           = { workspace = true }

[features]
default                       = []
libp2p                        = ["logos-blockchain-network-service/libp2p"]
logos-blockchain-pol-dev-mode = ["logos-blockchain-core/pol-dev-mode"]

[package]
categories  = { workspace = true }
description = { workspace = true }
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-blockchain-chain-broadcast-service"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lints]
workspace = true

[dependencies]
async-trait    = { workspace = true }
educe          = { features = ["Debug"], workspace = true }
lb-core        = { workspace = true }
lb-log-targets = { workspace = true }
overwatch      = { workspace = true }
serde          = { features = ["derive"], workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
utoipa         = { features = ["macros"], optional = true, workspace = true }

[features]
# Derives `utoipa` schemas for the types the node HTTP API serves.
openapi = ["dep:utoipa", "lb-core/openapi"]

[package]
categories  = { workspace = true }
description = { workspace = true }
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-blockchain-tx-service"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[package.metadata.cargo-machete]
# False positives.
ignored = [
  # Required by `utoipa`.
  "serde_json",
]

[lints]
workspace = true

[dependencies]
async-trait                      = "0.1"
futures                          = { default-features = false, version = "0.3" }
logos-blockchain-core            = { workspace = true }
logos-blockchain-network-service = { workspace = true }
logos-blockchain-services-utils  = { workspace = true }
logos-blockchain-storage-service = { workspace = true }
overwatch                        = { workspace = true }
rand                             = { workspace = true }
serde                            = { workspace = true }
serde_json                       = { default-features = false, optional = true, version = "1" }
thiserror                        = "1.0"
tokio                            = { default-features = false, version = "1" }
tokio-stream                     = { default-features = false, version = "0.1" }
tracing                          = { workspace = true }
utoipa                           = { optional = true, workspace = true }

[dev-dependencies]
logos-blockchain-tracing-service = { workspace = true }
logos-blockchain-tx-service      = { features = ["mock", "rocksdb-backend"], path = "." }
logos-blockchain-utils           = { workspace = true }
overwatch-derive                 = { workspace = true }
tempfile                         = "3"
tokio                            = { default-features = false, version = "1" }

[features]
default         = []
instrumentation = []
libp2p          = ["logos-blockchain-network-service/libp2p"]
mock            = ["logos-blockchain-core/mock", "logos-blockchain-network-service/mock"]
rocksdb-backend = ["logos-blockchain-storage-service/rocksdb-backend"]

# enable to help generate OpenAPI
openapi = ["dep:serde_json", "dep:utoipa"]

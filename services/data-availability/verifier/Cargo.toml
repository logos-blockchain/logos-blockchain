[package]
categories  = { workspace = true }
description = { workspace = true }
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-blockchain-da-verifier-service"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lints]
workspace = true

[dependencies]
async-trait                               = "0.1"
futures                                   = { default-features = false, version = "0.3" }
libp2p                                    = { workspace = true }
logos-blockchain-core                     = { workspace = true }
logos-blockchain-da-network-core          = { workspace = true }
logos-blockchain-da-network-service       = { workspace = true }
logos-blockchain-kzgrs-backend            = { workspace = true }
logos-blockchain-services-utils           = { workspace = true }
logos-blockchain-storage-service          = { workspace = true }
logos-blockchain-subnetworks-assignations = { workspace = true }
logos-blockchain-tracing                  = { workspace = true }
logos-blockchain-tx-service               = { workspace = true }
logos-blockchain-utils                    = { features = ["serde"], workspace = true }
overwatch                                 = { workspace = true }
serde                                     = { workspace = true }
serde_with                                = { workspace = true }
thiserror                                 = "1.0"
tokio                                     = { default-features = false, version = "1" }
tokio-stream                              = { default-features = false, version = "0.1.15" }
tracing                                   = { workspace = true }

[features]
libp2p          = []
rocksdb-backend = ["logos-blockchain-storage-service/rocksdb-backend"]

[package]
categories  = { workspace = true }
description = { workspace = true }
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-blockchain-tracing-service"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lints]
workspace = true

[features]
tokio-console = ["dep:console-subscriber"]
# Backwards-compatible alias. Existing users of `profiling` still get the
# tracing service's tokio-console support.
profiling = ["tokio-console"]

[dependencies]
async-trait        = { workspace = true }
console-subscriber = { optional = true, workspace = true }
lb-log-targets     = { workspace = true }
lb-tracing         = { workspace = true }
overwatch          = { workspace = true }
serde              = { workspace = true }
thiserror          = { workspace = true }
time               = { workspace = true }
tokio              = { features = ["sync"], workspace = true }
tracing            = { workspace = true }
tracing-appender   = { workspace = true }
tracing-subscriber = { workspace = true }

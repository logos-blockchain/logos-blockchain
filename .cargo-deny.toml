# Config file reference can be found at https://embarkstudios.github.io/cargo-deny/checks/cfg.html.

[graph]
all-features = true
exclude-dev  = false

[advisories]
# When adding a new line, please consider to which group the advisory belongs, and whether the issue can be fixed by upgrading some dependencies.
ignore = [
  # Unmaintained deps. To review periodically to check if they can be removed with an upgrade.
  { id = "RUSTSEC-2024-0388", reason = "`derivative` is unmaintained. No workspace crate depends on it directly. Pulled in via `ark-groth16` -> `ark-crypto-primitives`, which requires it non-optionally in both 0.5 and 0.6, so no arkworks upgrade can drop it. Re-evaluate this entry on future arkworks releases." },
  { id = "RUSTSEC-2024-0436", reason = "`paste` is unmaintained. No workspace crate depends on it directly. Pulled in via `ark-ff` 0.5 (removed in 0.6, which needs jellyfish/`jf-poseidon2` on arkworks 0.6 first) and via `netlink-packet-core` 0.8 behind libp2p's `if-watch` (removed in 0.9, but `if-watch` 3.2.2 still requires ^0.8.1). Re-evaluate this entry in the future and drop it once/if both are gone." },
  # Vulnerable deps, affecting our production code. To review periodically to check if they can be removed with an upgrade.
  { id = "RUSTSEC-2026-0119", reason = "`hickory-proto` O(n^2) name compression during DNS message encoding. Hickory is used only as the stub resolver behind libp2p DNS, and this encoder handles small outbound queries rather than many-record responses, so exposure is low. A fix requires Hickory 0.26.1+, which needs a coordinated Libp2p upgrade." },
  { id = "RUSTSEC-2026-0491", reason = "`hickory-proto` 0.25.2 can over-allocate memory while decoding untrusted DNS packets. This path is used by the node's Libp2p DNS resolver, so this is an accepted risk until the Libp2p stack can move from Hickory 0.25 to >= 0.26.2." },
  { id = "RUSTSEC-2026-0534", reason = "`libp2p-gossipsub` 0.49.5 stores backoff state for PRUNE entries naming topics the node never joined, allowing peers to grow memory use with entries retained for up to an hour. The fix in 0.50.1 requires libp2p-swarm 0.48, libp2p-core 0.44, and rand 0.10; this workspace's libp2p 0.56 and libp2p-stream 0.4 use the incompatible 0.47/0.43 stack. Accept temporarily pending a coordinated Libp2p upgrade." },
  # DNSSEC validation is not enabled; cargo tree confirms hickory-proto only has futures-io, std, and tokio features.
  { id = "RUSTSEC-2026-0118", reason = "The unbounded NSEC3 closest-encloser loop requires Hickory DNSSEC validation (`dnssec-ring` or `dnssec-aws-lc-rs`), neither of which is enabled in this workspace. The affected validator is not compiled." },
  { id = "RUSTSEC-2026-0504", reason = "This is an NSEC3 DNSSEC validation flaw. The workspace does not enable Hickory's DNSSEC validation features, so the affected validator is not compiled." },
  { id = "RUSTSEC-2026-0505", reason = "This is an NSEC3 DNSSEC validation flaw. The workspace does not enable Hickory's DNSSEC validation features, so the affected validator is not compiled." },
  { id = "RUSTSEC-2026-0511", reason = "This is an NSEC DNSSEC validation flaw. The workspace does not enable Hickory's DNSSEC validation features, so the affected validator is not compiled." },
  { id = "RUSTSEC-2026-0512", reason = "This is a DNSSEC validation flaw. The workspace does not enable Hickory's DNSSEC validation features, so the affected validator is not compiled." },
  { id = "RUSTSEC-2026-0514", reason = "This affects resolver lookups only when DNSSEC validation is enabled. The workspace does not enable Hickory's DNSSEC validation features." },
  { id = "RUSTSEC-2026-0530", reason = "This is an NSEC DNSSEC validation flaw. The workspace does not enable Hickory's DNSSEC validation features, so the affected validator is not compiled." },
  { id = "RUSTSEC-2026-0531", reason = "This is an NSEC/NSEC3 DNSSEC validation flaw. The workspace does not enable Hickory's DNSSEC validation features, so the affected validator is not compiled." },
  { id = "RUSTSEC-2026-0532", reason = "This is an NSEC3 DNSSEC validation flaw. The workspace does not enable Hickory's DNSSEC validation features, so the affected validator is not compiled." },
  # Unmaintained deps. Acknowledged but a replacement has not been decided yet.
  { id = "RUSTSEC-2024-0449", reason = "`unsafe-libyaml` is unmaintained. Pulled in via deprecated `serde_yaml` 0.9, used by workspace crates and by `kube-client` and `cfgsync-core`, so migrating the workspace alone won't drop it." },
  { id = "RUSTSEC-2025-0141", reason = "`bincode` is unmaintained but continuing to use it." },

  # Vulnerable deps, not affecting our production code.
  { id = "RUSTSEC-2026-0487", reason = "This panic is reachable only through Hickory zone-file text parsing. The node uses its DNS wire-format resolver and does not parse untrusted zone files." },
  { id = "RUSTSEC-2026-0194", reason = "`quick-xml` < 0.41 quadratic duplicate-attribute scan when parsing untrusted XML. Reached only through the optional `profiling` feature (`lb-http-api-common` -> `pprof` 0.15 -> `inferno` 0.11 -> `quick-xml` 0.26); `pprof` is absent from default node builds and no CI or release build enables it. `inferno` uses `quick-xml` to WRITE flamegraph SVG from our own profiler output - we never feed it untrusted XML, and the affected APIs are parser-side. `inferno` 0.12.8 already uses the patched `quick-xml` ^0.41, but `pprof` 0.15.0 (latest) pins `inferno` ^0.11, so this is blocked upstream. The patched `quick-xml` 0.41.0 is already in the graph via `junit-report`; only the 0.26 copy is affected." },
  { id = "RUSTSEC-2026-0195", reason = "`quick-xml` < 0.41 unbounded `NsReader` namespace-declaration allocation when parsing untrusted XML. Reached only through the optional `profiling` feature (`lb-http-api-common` -> `pprof` 0.15 -> `inferno` 0.11 -> `quick-xml` 0.26); `pprof` is absent from default node builds and no CI or release build enables it. `inferno` uses `quick-xml` to WRITE flamegraph SVG from our own profiler output - we never feed it untrusted XML, and the affected APIs are parser-side. `inferno` 0.12.8 already uses the patched `quick-xml` ^0.41, but `pprof` 0.15.0 (latest) pins `inferno` ^0.11, so this is blocked upstream. The patched `quick-xml` 0.41.0 is already in the graph via `junit-report`; only the 0.26 copy is affected." },
  { id = "RUSTSEC-2026-0489", reason = "This panic is reachable only through Hickory zone-file text parsing. The node uses its DNS wire-format resolver and does not parse untrusted zone files." },
  { id = "RUSTSEC-2026-0490", reason = "This panic is reachable only through Hickory's zone-file lexer. The node uses its DNS wire-format resolver and does not parse untrusted zone files." },
]
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
yanked = "deny"

[bans]
allow-wildcard-paths = false
multiple-versions    = "allow"

[bans.std-replacements]
level = "deny"
scope = "workspace"

[bans.workspace-dependencies]
duplicates = "deny"
unused     = "deny"

[licenses]
allow = [
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "BlueOak-1.0.0",
  "CC0-1.0",
  "CDDL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
private = { ignore = false }
unused-allowed-license = "deny"
unused-license-exception = "deny"

[sources]
allow-git = [
  "https://github.com/EspressoSystems/jellyfish.git",
  "https://github.com/arkworks-rs/spongefish.git",
  "https://github.com/logos-blockchain/logos-blockchain-circuits.git",
  "https://github.com/logos-blockchain/logos-blockchain-rust-rapidsnark.git",
  "https://github.com/logos-blockchain/logos-blockchain-testing.git",
]
required-git-spec = "tag"
unknown-git = "deny"
unknown-registry = "deny"
unused-allowed-org = "deny"
unused-allowed-source = "deny"

[sources.allow-org]
github = ["logos-co"]

[package]
categories  = { workspace = true }
description = "Logos SQL (λSQL) - decentralized SQLite over Logos Blockchain"
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-sql"
publish     = false
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lints]
workspace = true

[dependencies]
bincode                          = { workspace = true }
blake2                           = { workspace = true }
flate2                           = { features = ["rust_backend"], workspace = true }
lb-binary-codec                  = { workspace = true }
lb-key-management-system-service = { workspace = true }
lb-log-targets                   = { workspace = true }
lb-utils                         = { workspace = true }
lb-zone-sdk                      = { workspace = true }
rand                             = { features = ["getrandom"], workspace = true }
reqwest                          = { workspace = true }
rusqlite                         = { features = ["backup", "bundled", "functions", "hooks", "limits"], workspace = true }
thiserror                        = { workspace = true }
tokio                            = { features = ["macros", "rt", "sync", "time"], workspace = true }
tracing                          = { workspace = true }

[dev-dependencies]
chacha20poly1305 = { features = ["alloc", "rand_core"], workspace = true }
clap             = { features = ["derive", "env", "help", "std"], workspace = true }
hex              = { workspace = true }
lb-core          = { features = ["test-utils"], workspace = true }
lb-groth16       = { workspace = true }
tempfile         = { workspace = true }
tokio            = { features = ["io-util", "net"], workspace = true }
zeroize          = { features = ["alloc"], workspace = true }

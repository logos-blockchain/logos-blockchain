[package]
categories  = { workspace = true }
description = { workspace = true }
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-blockchain-c"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
logos-blockchain-api-service                = { workspace = true }
logos-blockchain-chain-service              = { workspace = true }
logos-blockchain-core                       = { workspace = true }
logos-blockchain-cryptarchia-engine         = { workspace = true }
logos-blockchain-key-management-system-keys = { workspace = true }
logos-blockchain-node                       = { default-features = true, workspace = true }
logos-blockchain-wallet                     = { workspace = true }
num-bigint                                  = { version = "0.4", default-features = false }
overwatch                                   = { workspace = true }
serde_yaml                                  = { default-features = false, workspace = true }
tokio                                       = { default-features = false, features = ["rt-multi-thread"], workspace = true }

[build-dependencies]
cbindgen = "0.29"

[lib]
crate-type = ["cdylib"]
name       = "lib_logos_blockchain"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["cbindgen"] # machete does not recognize this for build dep and complains.

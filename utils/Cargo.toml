[package]
categories  = { workspace = true }
description = { workspace = true }
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "logos-blockchain-utils"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lints]
workspace = true

[dependencies]
async-trait    = { workspace = true }
const-hex      = { features = ["alloc"], workspace = true }
futures        = { optional = true, workspace = true }
humantime      = { optional = true, workspace = true }
lb-log-targets = { workspace = true }
multiaddr      = { workspace = true }
overwatch      = { workspace = true }
rand           = { features = ["getrandom"], workspace = true }
rand_chacha    = { optional = true, workspace = true }
serde          = { features = ["alloc", "derive"], workspace = true }
serde_ignored  = { workspace = true }
serde_with     = { optional = true, workspace = true }
serde_yaml     = { workspace = true }
thiserror      = { workspace = true }
time           = { features = ["serde-human-readable"], optional = true, workspace = true }
tokio          = { optional = true, workspace = true }
tracing        = { workspace = true }

[features]
rng              = ["dep:rand_chacha"]
serde            = ["const-hex/alloc", "serde/alloc"]
time             = ["dep:humantime", "dep:serde_with", "dep:time"]
tokio            = ["dep:futures", "dep:tokio"]
tokio-task-names = ["tokio", "tokio/rt", "tokio/tracing"]

[dev-dependencies]
bincode     = { workspace = true }
blake2      = { workspace = true }
nistrs      = { workspace = true }
serde_json  = { features = ["alloc"], workspace = true }
serde_with  = { features = ["macros"], workspace = true }
tempfile    = { workspace = true }
